version: 2
updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: daily
    time: "10:00"
  open-pull-requests-limit: 10
  rebase-strategy: auto
  groups:
    development-dependencies:
      dependency-type: development
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
