name: ci

on:
  push:
    branches-ignore:
      - '**.tmp'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly, '1.88.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo test --all-features
      - run: cargo test --release --all-features
      - run: cargo check --all-targets --all-features

  features:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: rustup component add clippy
      - run: |
          cargo test --no-default-features
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo doc --no-deps --no-default-features
          for feature in bup buzhash fastcdc gear gzip mii pigz ram zpaq zstd; do
            cargo test --no-default-features --features "$feature"
            cargo clippy --all-targets --no-default-features --features "$feature" -- -D warnings
            cargo doc --no-deps --no-default-features --features "$feature"
          done

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo bench --bench compare -- --test
      - run: cargo bench --no-default-features --bench compare -- --test
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
