name: ci

on:
  push:
    branches-ignore:
      - '**.tmp'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly, '1.88.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --all-features
      - run: cargo test --release --all-features
      - run: cargo check --all-targets --all-features

  features:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: rustup component add clippy
      - run: |
          cargo test --no-default-features
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo doc --no-deps --no-default-features
          for feature in bup buzhash fastcdc gear gzip mii pigz ram zpaq zstd rabin rabin-karp ae gear64 fastcdc2020 seqcdc ultracdc leap supercdc tttd simd; do
            cargo test --no-default-features --features "$feature"
            cargo clippy --all-targets --no-default-features --features "$feature" -- -D warnings
            cargo doc --no-deps --no-default-features --features "$feature"
          done

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo bench --all-features --bench compare -- --test
      - run: cargo bench --no-default-features --bench compare -- --test
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
