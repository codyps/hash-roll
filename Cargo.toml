[package]
name = "hash-roll"
version = "0.3.0"
authors = ["Cody P Schafer <dev@codyps.com>"]
description = "Rolling hashes & Content Defined Chunking (cdc)"
keywords = [ "hash", "rolling", "incremental", "split" , "cdc"]
license = "OSL-3.0"
repository = "https://github.com/codyps/hash-roll.git"
documentation = "https://docs.rs/hash-roll"
include = ["Cargo.toml", "**/*.rs", "README.md", "COMPARE.md", "CHANGELOG.md", "LICENSE-OSL-3.0", "THIRD-PARTY-NOTICES"]
edition = "2018"
rust-version = "1.88"
resolver = "3"

[features]
default = [
	"bup",
	"buzhash",
	"fastcdc",
	"gear",
	"gzip",
	"mii",
	"pigz",
	"ram",
	"zpaq",
	"zstd",
	"rabin",
	"rabin-karp",
	"ae",
	"gear64",
	"fastcdc2020",
	"seqcdc",
	"ultracdc",
	"leap",
	"supercdc",
	"tttd"
]

bup = []
buzhash = []
fastcdc = []
gear = []
gzip = []
mii = []
pigz = []
ram = []
zpaq = []
zstd = []
rabin = []
rabin-karp = []
ae = []
gear64 = []
fastcdc2020 = []
seqcdc = []
ultracdc = []
leap = []
supercdc = ["fastcdc2020"]
tttd = ["rabin"]
simd = ["ae"]

[dependencies]
fmt-extra = "0.2"

[dev-dependencies]
rand = "0.10.3"
quickcheck = "1.1"
rollsum = "0.3"
criterion = "0.8.2"
rand_pcg = "0.10.2"
proptest = "1.12"
fastcdc = "=5.0.0" # Independent oracle for the versioned 2020 boundaries.

[[bench]]
name = "compare"
harness = false
